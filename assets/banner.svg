<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="La Forja del Desarrollador — Setup completo para desarrollar con Claude Code en Windows">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#2a2320"/>
      <stop offset="100%" stop-color="#17151a"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#f0722e"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- Grid sutil -->
  <g stroke="#ffffff" stroke-opacity="0.03">
    <path d="M300 0V400M600 0V400M900 0V400"/>
    <path d="M0 100H1200M0 200H1200M0 300H1200"/>
  </g>

  <!-- Marca: yunque geometrico + chispa -->
  <g transform="translate(120,128)">
    <!-- chispa -->
    <path d="M72 -34 L78 -18 L94 -12 L78 -6 L72 10 L66 -6 L50 -12 L66 -18 Z" fill="url(#ember)"/>
    <!-- cuerpo del yunque -->
    <path d="M0 40 H128 L104 72 H88 V104 H120 V128 H24 V104 H56 V72 H24 Z"
          fill="none" stroke="url(#ember)" stroke-width="6" stroke-linejoin="round"/>
    <!-- linea de base -->
    <path d="M8 144 H136" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="330" y="172" font-size="56" font-weight="700" letter-spacing="2" fill="#f5f0ea">LA FORJA</text>
    <text x="330" y="228" font-size="34" font-weight="300" letter-spacing="6" fill="#c9c2ba">DEL DESARROLLADOR</text>
    <text x="330" y="286" font-size="19" fill="#8a847d">Setup completo para desarrollar con Claude Code en Windows</text>
    <!-- comando -->
    <g font-family="Consolas, Menlo, monospace">
      <rect x="330" y="308" width="430" height="40" rx="8" fill="#0f0e11" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="350" y="334" font-size="17" fill="#ffb454">&gt; forja-del-desarrollador.bat</text>
    </g>
  </g>

  <!-- Footer de marca -->
  <g font-family="Consolas, Menlo, monospace" font-size="15">
    <text x="1080" y="368" text-anchor="end" fill="#8a847d">ragustingarcia.com</text>
    <circle cx="1058" cy="363" r="3" fill="url(#ember)"/>
  </g>

  <!-- Numero de version, esquina -->
  <text x="1080" y="60" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="15" fill="#5c5750">v6.0</text>
</svg>
