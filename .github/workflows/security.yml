name: Security regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    name: Windows / ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isolated security tests (no installers or real authentication)
        run: |
          ./tests/security.tests.ps1
          ./tests/flows.tests.ps1
          ./tests/native-tools.tests.ps1
          ./tests/python-environment.tests.ps1
          ./tests/msi-repair.tests.ps1
          ./tests/stack.tests.ps1
          ./tests/progress-individual.tests.ps1
          ./tests/outcomes.tests.ps1
